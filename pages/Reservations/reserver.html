<div class="hero-scene text-center">

    <div class="hero-scene-content"> 
    <h1>Ma réservation</h1>
    </div>
</div>

<div class="container">
    <form>
        <div class="mb-3">
            <label for="NomInput" class="form-label">Votre nom</label>
            <input disabled type="text" class="form-control" id="NomInput" placeholder="Votre nom" value="Dupont">
        </div>
        <div class="mb-3">
            <label for="PrénomInput" class="form-label">Votre prénom</label>
            <input disabled type="text" class="form-control" id="PrénomInput" placeholder="Votre prénom" value="Jean">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email</label>
            <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.com" value="jean.dupont@gmail.com">
        </div>
        <div class="mb-3">
            <label for="PhoneNumberInput" class="form-label">Numéro de téléphone</label>
            <input type="number" class="form-control" id="PhoneNumberInput" placeholder="Votre numéro de téléphone" value="0612345678">
        </div>
        <div class="mb-3">
            <label for="nbConvivesInput" class="form-label">Nombre de convives</label>
            <input type="text" class="form-control" id="nbConvivesInput" placeholder="Nombre de convives">
        </div>
        <div class="mb-3">
            <label for="DateInput" class="form-label">Date</label>
            <input type="date" class="form-control" id="DateInput">
        </div>
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="ServiceChoisi" id="midiRadio">
                <label class="form-check-label" for="midiRadio">
                  Midi
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="ServiceChoisi" id="soirRadio" checked>
                <label class="form-check-label" for="soirRadio">
                  Soir
                </label>
              </div>
        </div>
        <div class="mb-3">
            <label for="SelectHour" class="form-label">Heure</label>
            <select class="form-select" id="SelectHour">
                <option>19:00</option>
                <option>19:30</option>
                <option>19:45</option>
                <option>20:00</option>
                <option>20:30</option>
                <option>20:45</option>
                <option>21:00</option>
                <option>21:30</option>
              </select>
        </div>
        <div class="mb-3">
            <label for="AllergieInput" class="form-label">Vos Allergies</label>
            <input type="text" class="form-control" id="AllergieInput" placeholder="Vos allergies">
        </div>
        <div class="text-center pt-2">
             <button type="submit" class="btn btn-primary">Réserver</button>
             <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#CancelResaModal">Annuler</button>
        </div>
       
    </form>
    </div>

    <div class="modal fade" id="CancelResaModal" tabindex="-1" aria-labelledby="CancelResaModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="DeletePhotoModalLabel">Êtes-vous sûr de vouloir annuler votre réservation ?</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <div class=text-center>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Revenir à la réservation</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Annuler</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
