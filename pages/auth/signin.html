<div class="hero-scene text-center">

    <div class="hero-scene-content"> 
    <h1>Connexion</h1>
    </div>
</div>
<div class="container">
  <form>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email</label>
      <input type="email" class="form-control" id="EmailInput" placeholder="test@mail.com">
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="PasswordInput" placeholder="mot de passe">
      <div class="invalid-feedback">
        Le mot de passe n'est pas assez fort : au moins 8 caractères, une majuscule, une minuscule, un chiffre et un caractère spécial.
      </div>
      <div class="valid-feedback">
        Mot de passe valide.
      </div>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="exampleCheck1">
      <label class="form-check-label" for="exampleCheck1">Rester connecter</label>
    </div>
    <div class=text-center>
    <button type="submit" class="btn btn-primary">Connexion</button>
    </div>
    <div class="text-center pt-2">
      <a href="#">Mot de passe oublié ? </a>
    <div class="text-center pt-2">
      <p>Pas encore de compte ? <a href="/signup">Inscrivez-vous</a></p>
    </div>
  </form>
  </div>
